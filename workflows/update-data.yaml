name: Update public domain authors

on:
  schedule:
    # 00:00 UTC on Jan 1, Apr 1, Jul 1, Oct 1
    - cron: "0 0 1 1,4,7,10 *"
  workflow_dispatch:  # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data
        run: python scripts/fetch_pd_authors.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portuguese_authors_public_domain.csv
          git diff --staged --quiet || git commit -m "chore: refresh public domain authors"
          git push