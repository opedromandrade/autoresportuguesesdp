<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autores Portugueses em Domínio Público</title>
  <link rel="stylesheet" href="css/csv-to-html-table.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 2rem auto;
      max-width: 1100px;
      padding: 0 1rem;
      color: #222;
    }
    h1 { font-size: 1.6rem; }
    p.intro { color: #555; }
    a { color: #0066cc; }
    #table-container { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>📚 Autores Portugueses em Domínio Público</h1>
  <p class="intro">
    Lista de autores portugueses cujas obras já se encontram em domínio público,
    extraída do <a href="https://www.wikidata.org/">Wikidata</a>.
  </p>

  <div id="table-container"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/csv-to-html-table.js"></script>
  <script>
    CsvToHtmlTable.init({
      csv_path: 'data/portuguese_authors_public_domain.csv',
      element: 'table-container',
      allow_download: true,
      csv_options: { separator: ',', delimiter: '"' },
      datatables_options: { paging: false }
    });
  </script>
</body>
</html>
